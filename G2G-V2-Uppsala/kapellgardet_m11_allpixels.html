      var sp=nbs.length?nbs[0].g.sp:cityG.sp, px=Math.sqrt((b[0]-a[0])*(b[0]-a[0])+(b[1]-a[1])*(b[1]-a[1]))/W;
      var ss=px>2.5*sp?3:(px>1.25*sp?2:1);                      // average several samples when zoomed out
      var ctx=cv.getContext('2d'), img=ctx.createImageData(W, H), o=img.data;
      var ux=b[0]-a[0], uy=b[1]-a[1], vx=d[0]-a[0], vy=d[1]-a[1], wx=a[0]-b[0]-d[0]+e[0], wy=a[1]-b[1]-d[1]+e[1];
      for (var j=0;j<H;j++) for (var i=0;i<W;i++){
        var R=0, G=0, B=0, m=0;
        for (var sy=0;sy<ss;sy++) for (var sx=0;sx<ss;sx++){
          var u=(i+(sx+0.5)/ss)/W, v=(j+(sy+0.5)/ss)/H;
          var k=cidxAt(a[0]+ux*u+vx*v+wx*u*v, a[1]+uy*u+vy*v+wy*u*v, nbs);
          if (k!==NONE){ var t=LUT[k]; R+=t[0]; G+=t[1]; B+=t[2]; m++; }
        }
        if (m){ var p=(j*W+i)*4; o[p]=R/m; o[p+1]=G/m; o[p+2]=B/m; o[p+3]=255; }   // average colour of the scored samples
      }
      ctx.putImageData(img, 0, 0);
      return cv;
    }
  });
  var grid=new Grid({opacity:0.65, pane:'overlayPane', bounds:L.latLngBounds(CFG.bounds), maxZoom:21,
                     updateWhenZooming:false, keepBuffer:1});
  window.G2G={grid:grid, nbs:NB, load:load};
  function update(){
    if (mp.getZoom()<CFG.swap) return;
    var vb=mp.getBounds();
    NB.forEach(function(nb){ if (!nb.g && !nb.p && vb.intersects(nb.llb))
      load(nb).then(function(){ if (grid._map) grid.redraw(); }, function(){}); });
  }
  cityP.then(function(){ grid.addTo(mp); ctl.addOverlay(grid, CFG.groupName); mp.on('zoomend moveend', update); update(); });
  var sl=document.getElementById('opac');
  if (sl) sl.addEventListener('input', function(){ grid.setOpacity(parseFloat(sl.value)); });
  function cityHtml(lat, lng, extra){
    if (!cityG) return null; var r=lookup(cityG, lat, lng); if (!r || r.q===65535) return null;
    return scoreHtml(cityG, r, 'Main reason', flagNotes(r.pf)+(extra||''));
  }
  mp.on('click', function(e){
    var la=e.latlng.lat, lo=e.latlng.lng, hi=mp.getZoom()>=CFG.swap, pop=null;
    var cand=hi ? NB.filter(function(nb){ return nb.llb.contains(e.latlng); }) : [];
    var fresh=cand.some(function(nb){ return !nb.g; });
    function show(h){ if (!h){ if (pop) mp.closePopup(pop); return; }
                      if (pop) pop.setContent(h); else L.popup().setLatLng(e.latlng).setContent(h).openOn(mp); }
    if (fresh || (CFG.city && !cityG))
      pop=L.popup().setLatLng(e.latlng).setContent("<div style='font:12px sans-serif'>Loading the map data&hellip;</div>").openOn(mp);
    Promise.all([cityP].concat(cand.map(load))).then(function(){
      if (fresh && grid._map) grid.redraw();                             // draw the 1 m data that just arrived
      for (var k=0; k<cand.length; k++){
        var nb=cand[k], r=lookup(nb.g, la, lo);
        if (!r || !(r.pf&64)) continue;                                  // outside the 1 m area
        if (r.q!==65535) return show(scoreHtml(nb.g, r, 'Main reason', inferredNote(r.pf)));
        if (r.pf&32) return show(cityHtml(la, lo, "<br><span style='color:#777'>No 1 m value here: Model 11 estimates heat in this part of "+
                                 nb.label+", which the 1 m run cannot reproduce, so the 10 m value is shown.</span>"));
        var why=CFG.exclusions[r.pf&7]||'for example a building, the road surface or existing tree canopy';
        return show("<div style='font:12px sans-serif;width:240px'><b>No 1 m score here</b><br><span style='color:#555'>"+
                    "Excluded at 1 m: "+why+".</span></div>");
      }
      show(cityHtml(la, lo, ''));
    }, function(err){ show(cityHtml(la, lo, "<br><span style='color:#777'>"+err.message+"</span>") ||
                           "<div style='font:12px sans-serif'>"+err.message+"</div>"); });
  });
}, 500); });
})();
